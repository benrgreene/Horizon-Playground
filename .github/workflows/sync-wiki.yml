name: Sync docs to wiki
on:
  # `closed` is the only PR event that covers a merge — GitHub has no `merged`
  # event type, so the job-level `if:` below filters out closed-without-merging.
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/sync-wiki.yml'
  # Manual "Run workflow" button. Deliberately unfiltered by `paths` so an
  # on-demand sync always runs — e.g. to recover after enabling Wikis.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-wiki
  cancel-in-progress: true
jobs:
  sync-wiki:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # On a `closed` event, checkout would otherwise default to refs/pull/N/merge —
      # a stale pre-merge test commit. merge_commit_sha is what actually landed on
      # main (correct for merge, squash, and rebase strategies alike).
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Mirror documentation to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_DIR: documentation
          # GITHUB_SHA on a pull_request event is the merge-ref SHA, which does not
          # exist in the repo's history — cite the commit that landed on main instead.
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail

          # Nothing to mirror yet: bail out BEFORE touching the wiki. Without this an empty or
          # missing docs folder would either fail the job (find on a missing dir) or delete every
          # existing wiki page and replace them with nothing.
          if [ ! -d "$DOCS_DIR" ] || [ -z "$(find "$DOCS_DIR" -type f -name '*.md' -print -quit)" ]; then
            echo "::notice::No Markdown files in '$DOCS_DIR' yet — nothing to sync. The wiki was left untouched."
            exit 0
          fi

          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          wiki_dir="$(mktemp -d)"

          # The wiki's git backend only exists once the wiki has at least one page.
          if ! git clone "$wiki_url" "$wiki_dir"; then
            echo "::error::Could not clone the wiki. Enable Wikis for this repo and create one initial page (e.g. Home) in the GitHub UI, then re-run."
            exit 1
          fi

          # Mirror: drop existing top-level wiki markdown pages, then copy the docs in.
          # Preserves the wiki's .git dir, non-markdown assets, and special
          # navigation pages (_Sidebar.md, _Footer.md, _Header.md).
          find "$wiki_dir" -maxdepth 1 -type f -name '*.md' -not -name '_*' -delete

          # Copy every markdown file from the docs folder, flattening into the wiki root.
          # README.md becomes Home.md (the wiki landing page).
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            [ "$base" = "README.md" ] && base="Home.md"
            cp "$f" "$wiki_dir/$base"
          done < <(find "$DOCS_DIR" -type f -name '*.md' -print0)

          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync documentation to wiki (${SOURCE_SHA})"
            git push
          fi
